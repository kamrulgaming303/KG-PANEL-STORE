<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>KG PANEL STORE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="mark">KG</div>
    <div><h1>KG PANEL STORE</h1><p>Apps • Tools • Updates</p></div>
  </header>
  <main>
    <section class="hero">
      <span class="eyebrow">WELCOME</span>
      <h2>Discover useful apps.</h2>
      <p>Browse the app catalogue and download apps from their official sources.</p>
      <button id="refresh">Refresh apps</button>
    </section>
    <section class="section-head"><h2>Available apps</h2><span id="count">—</span></section>
    <div id="status" class="status">Loading apps…</div>
    <section id="apps" class="apps"></section>
    <p class="foot">KG PANEL STORE · Only install apps from sources you trust.</p>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
